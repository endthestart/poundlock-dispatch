name: Release
# A version tag runs the whole CI workflow on the tagged commit. The draft
# release then waits for approval in the `release` environment (configure it
# with a required reviewer). Only the packages CI built and checked are
# attached; nothing is rebuilt, and nothing goes to a package registry.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write # the draft GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Check the tested packages match the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp "artifacts/dispatch-linux-x86_64/poundlock-dispatch-gui-${version}.tar.gz" dist/
          cp "artifacts/dispatch-macos-arm64/Poundlock Dispatch-${version}-arm64-mac.zip" dist/
          cp artifacts/dispatch-linux-x86_64/poundlock-dispatch.cdx.json dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - name: Create a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Poundlock Dispatch ${GITHUB_REF_NAME#v}" \
            --notes "Developer preview. The macOS app is ad-hoc signed and not notarized. See CHANGELOG.md and docs/INSTALL.md."
