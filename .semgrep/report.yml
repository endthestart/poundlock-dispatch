# Semgrep rules that are reported but do not fail the build, because each still
# has findings to review; CI prints them on every run.
# When a rule's findings are fixed, move it to block.yml.
rules:
  - id: dispatch-ts-process-env-passthrough
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The whole parent environment is handed to a child process. Pass an
      allow-listed environment so tokens and keys are not inherited.
    pattern-either:
      - pattern: '$F(..., { ..., env: process.env, ... })'
      - pattern: '$F(..., { ..., env: { ...process.env, ... }, ... })'
    paths:
      exclude: ["tests/**", "**/*.test.ts"]
